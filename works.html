<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Works | Ettisaf Rup</title>
    <meta
      name="description"
      content="Projects by Ettisaf Rup — CleanWrap, rgit, CholoKUET, zipcity-bd, GridWise LLM, and more."
    />
    <meta name="theme-color" content="#1c1c1c" />
    <link rel="canonical" href="https://ettisafxrup.github.io/works.html" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <script>
      try {
        const theme = localStorage.getItem("theme")
        if (theme) document.documentElement.dataset.theme = theme
      } catch {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="page">
      <div class="topbar">
        <a class="back-link" href="./">← Back to Resume</a>
        <button class="theme-toggle" type="button" aria-label="Toggle theme">☾</button>
      </div>

      <header>
        <h1 class="page-title">🧧 WORKFILES</h1>
        <p class="page-intro">Things I've built — from systems tools to web apps.</p>
      </header>

      <main id="works" class="works-grid" aria-busy="true">
        <div class="status" style="grid-column: 1 / -1">
          <div class="spinner"></div>
          Loading projects…
        </div>
      </main>

      <footer class="footer">© <span id="year">2026</span> Ettisaf Rup</footer>
    </div>

    <noscript><p class="status">Please enable JavaScript to view this page.</p></noscript>
    <script type="module" src="js/works.js"></script>
  </body>
</html>
